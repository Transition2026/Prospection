name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure the tag matches the application version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Le tag v$tagVersion ne correspond pas a la version $packageVersion de package.json."
          }
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Build and publish the installer and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run desktop:publish
